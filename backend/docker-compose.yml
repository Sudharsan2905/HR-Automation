services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://host.docker.internal:27017
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./level1_files:/app/level1_files
    restart: unless-stopped
